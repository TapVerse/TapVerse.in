<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indriya - Review</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            /* Indriya restaurant background */
            background: url('Indriya bg screen(1).png') center center / cover no-repeat fixed;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            padding: 1.5rem;
            position: relative;
        }

        /* Indriya logo - this is the part that rotates */
        .logo-wrapper {
            width: 260px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spin 12s linear infinite;
            cursor: pointer;
            transition: transform 0.15s ease;
            position: relative;
        }

        .logo-wrapper:hover {
            animation-play-state: paused;
            transform: scale(1.04);
        }

        .logo-wrapper:active {
            transform: scale(0.92);
            animation-play-state: running;
        }

        .indriya-logo {
            width: 240px;
            height: 240px;
            object-fit: contain;
            display: block;
        }

        /* Text stays stable and does NOT rotate */
        .cta-text {
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: 3px;
            color: #f5e6d3;
            text-shadow:
                0 2px 12px rgba(0, 0, 0, 0.7),
                0 0 40px rgba(200, 150, 100, 0.25);
            cursor: pointer;
            opacity: 0.9;
            transition: opacity 0.3s ease, transform 0.3s ease;
            position: relative;
            padding-bottom: 6px;
        }

        .cta-text::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #e8c48a, transparent);
            transition: width 0.4s ease;
        }

        .logo-wrapper:hover ~ .cta-text::after,
        .cta-text:hover::after {
            width: 80%;
        }

        .cta-text span {
            display: inline-block;
            animation: pulse-text 2.4s ease-in-out infinite;
        }

        /* Sparkles */
        .sparkle {
            position: fixed;
            pointer-events: none;
            font-size: 1.2rem;
            opacity: 0;
            z-index: 10;
            animation: sparkle-fly 1.2s ease-out forwards;
        }

        /* Logo rotation */
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Text pulse */
        @keyframes pulse-text {
            0%, 100% {
                opacity: 0.7;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.04);
            }
        }

        /* Sparkle animation */
        @keyframes sparkle-fly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.5) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(360deg);
            }
        }

        /* Click bounce */
        .logo-wrapper.bounce {
            animation: bounce-logo 0.4s ease !important;
        }

        @keyframes bounce-logo {
            0% {
                transform: scale(1);
            }
            30% {
                transform: scale(0.85) rotate(-8deg);
            }
            60% {
                transform: scale(1.1) rotate(4deg);
            }
            80% {
                transform: scale(0.95) rotate(-2deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        /* Mobile */
        @media (max-width: 500px) {
            .logo-wrapper {
                width: 200px;
                height: 200px;
            }

            .indriya-logo {
                width: 185px;
                height: 185px;
            }

            .cta-text {
                font-size: 1.2rem;
                letter-spacing: 2px;
            }
        }

        @media (max-width: 380px) {
            .logo-wrapper {
                width: 160px;
                height: 160px;
            }

            .indriya-logo {
                width: 145px;
                height: 145px;
            }

            .cta-text {
                font-size: 1rem;
                letter-spacing: 1px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Indriya logo - clickable and rotating -->
        <div
            class="logo-wrapper"
            id="logoWrapper"
            role="button"
            tabindex="0"
            aria-label="Tap On The Logo"
        >
            <img
                src="indriya logo(2).png"
                class="indriya-logo"
                alt="Indriya Logo"
            >
        </div>

        <!-- This text remains stable while the logo rotates -->
        <p class="cta-text">
            <span>✦</span> &nbsp;Tap On The Logo&nbsp; <span>✦</span>
        </p>

    </div>

    <script>
        (function() {

            const logoWrapper = document.getElementById('logoWrapper');

            // Google review page
            const placeId = 'ChIJFXRng6LJ5zsRLyf-ckOKt0I';
            const targetURL =
                `https://search.google.com/local/writereview?placeid=${placeId}`;

            // Sparkle burst
            function createSparkles(x, y, count = 16) {

                const emojis = ['✨', '⭐', '💫', '🌟', '✦', '•'];

                for (let i = 0; i < count; i++) {

                    const el = document.createElement('div');

                    el.className = 'sparkle';
                    el.textContent =
                        emojis[Math.floor(Math.random() * emojis.length)];

                    const angle = Math.random() * 2 * Math.PI;
                    const dist = 40 + Math.random() * 90;

                    const tx = Math.cos(angle) * dist;
                    const ty = Math.sin(angle) * dist - 40;

                    el.style.setProperty('--tx', tx + 'px');
                    el.style.setProperty('--ty', ty + 'px');

                    el.style.left =
                        (x - 10 + Math.random() * 20) + 'px';

                    el.style.top =
                        (y - 10 + Math.random() * 20) + 'px';

                    el.style.fontSize =
                        (0.8 + Math.random() * 1.2) + 'rem';

                    el.style.animationDuration =
                        (0.8 + Math.random() * 0.6) + 's';

                    document.body.appendChild(el);

                    setTimeout(() => el.remove(), 1500);
                }
            }

            // Handle logo click
            function handleClick() {

                // Bounce
                logoWrapper.classList.remove('bounce');

                void logoWrapper.offsetWidth;

                logoWrapper.classList.add('bounce');

                // Sparkles
                const rect = logoWrapper.getBoundingClientRect();

                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;

                createSparkles(cx, cy, 22);

                // Open Google review page
                setTimeout(() => {
                    window.open(targetURL, '_blank');
                }, 350);

                // Remove bounce
                setTimeout(() => {
                    logoWrapper.classList.remove('bounce');
                }, 450);
            }

            // Click logo
            logoWrapper.addEventListener('click', handleClick);

            // Keyboard support
            logoWrapper.addEventListener('keydown', (e) => {

                if (e.key === 'Enter' || e.key === ' ') {

                    e.preventDefault();

                    handleClick();
                }
            });

            // Clicking the text also opens the review page
            const ctaText = document.querySelector('.cta-text');

            if (ctaText) {

                ctaText.addEventListener('click', () => {
                    handleClick();
                });
            }

        })();
    </script>

</body>
</html>
